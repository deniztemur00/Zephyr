[package]
name = "zephyr"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Native desktop client for YouTube Music"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
directories = "6.0.0"
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "crisp", "tokio", "image-without-codecs"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "blocking"] }
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "isomp4"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", default-features = false, features = ["rt", "net", "time"] }
toml = "1.1.8"

# Keeps target\debug small: backtraces keep file:line, dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.39.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
